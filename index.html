<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musselers">
<meta name="theme-color" content="#0f1b24">
<title>Avila Musselers</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1b24; --bg2:#152532; --card:#1a2d3c; --line:#26404f;
  --ink:#eef3f1; --mute:#93a9b3; --sand:#e9c98f; --kelp:#6fbf9a; --coral:#f08a6b;
  --water:#4fa3c7; --deep:#2d6f8f; --night:#0b141b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(18px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:34px;letter-spacing:-.5px;line-height:1}
h1 span{color:var(--sand)}
.sub{color:var(--mute);font-size:13px;margin-top:6px}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.banner{border-radius:14px;padding:12px 14px;margin-top:16px;font-size:14px;line-height:1.4}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner a{color:inherit}
.banner.season{text-align:center;padding:16px 14px}
.banner.season b{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:800;margin:0}
.banner.season .sd{font-size:16px;font-weight:700;margin-top:4px;letter-spacing:.02em}
.banner.season .sn{font-size:12px;opacity:.75;margin-top:8px}
.bio{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.bio .bk{color:var(--mute);font-size:14px}
.bio .bv{font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:800;letter-spacing:.04em;margin-top:2px;color:var(--mute)}
.bio.safe .bv{color:#5fd39a}.bio.unsafe .bv{color:#ff6b55}
.bio.safe{border-color:#2f5f4c}.bio.unsafe{border-color:#74392b}
.bio .bs{color:var(--mute);font-size:12px;margin-top:4px;line-height:1.4}
.bio .bs.warn{color:#f0c36b}
.callbtn{display:inline-block;margin-top:6px;background:var(--sand);color:#2b1d00;font-weight:700;font-size:13px;padding:8px 16px;border-radius:999px;text-decoration:none}
.callbtn:active{transform:scale(.96)}
.callnum{font-size:11px;color:var(--mute);margin-top:6px}
.top{display:flex;justify-content:center;align-items:center;gap:12px;text-align:center}
.calbox{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;background:var(--card);border:1.5px solid var(--sand);border-radius:16px;padding:12px 16px;color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.calbox:active{transform:scale(.98);background:#22384a}
.calbox svg{flex:none;width:46px;height:46px;margin:0}
.cbt{flex:1;display:flex;flex-direction:column}
.cbt b{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:700}
.cbt span{color:var(--mute);font-size:13px;margin-top:2px}
.chev{font-size:30px;color:var(--sand);line-height:1}
.cal{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
.cal[hidden]{display:none}
.dayv{z-index:11}
.daynav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute);font-size:12px}
.daynav button{background:var(--card);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:22px;cursor:pointer}
.daynav button:disabled{opacity:.25;cursor:default}
#dayDetail{transition:transform .18s ease,opacity .18s ease}
#dayDetail.out-l{transform:translateX(-40px);opacity:0}#dayDetail.out-r{transform:translateX(40px);opacity:0}
.cal>*{max-width:560px;margin-left:auto;margin-right:auto}
.calbar{display:flex;justify-content:space-between;align-items:center}
.back{background:none;border:0;color:var(--sand);font:inherit;font-size:16px;font-weight:700;cursor:pointer;width:60px;text-align:left}
.calt{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600}
.calnav{display:flex;justify-content:space-between;align-items:center;margin:18px auto 10px}
.calnav button:disabled{opacity:.25;cursor:default}
.calnav button{background:var(--card);border:1px solid var(--line);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:24px;cursor:pointer}
.calm{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dows div{text-align:center;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:5px 2px 4px;text-align:center;cursor:pointer;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center}
.cell.empty{background:none;border:0;cursor:default}
.cell .n{font-size:14px;font-weight:700}
.cell .stars{color:#f0c36b;font-size:15px;line-height:1.2;margin-top:3px;letter-spacing:-1px}
.cell .lv{font-size:10px;color:var(--mute);margin-top:auto}
.cell.s1,.cell.s2{border-color:#5d5232}
.cell.today .n{background:var(--coral);color:#1a0d08;border-radius:999px;padding:0 6px}
.calkey{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:14px}
.calkey .st{color:#f0c36b}
.calnote{font-size:12px;color:var(--mute);margin-top:8px}
.banner.ok{background:#1d3a30;border:1px solid #2f5f4c;color:#cfeee0}
.banner.no{background:#41231c;border:1px solid #74392b;color:#ffd9cc}
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.now .card .k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.now .card .v{font-size:26px;font-weight:700;margin-top:4px}
.now .card .s{color:var(--mute);font-size:13px;margin-top:2px}
.best{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.row:active{transform:scale(.99)}
.row.sel{border-color:var(--sand)}
.date{width:52px;text-align:center;flex:none}
.date .dw{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.date .dd{font-family:Fraunces,serif;font-size:24px;font-weight:800;line-height:1.05}
.date .dm{font-size:11px;color:var(--mute)}
.mid{flex:1;min-width:0}
.mid .t{font-weight:700;font-size:15px}
.mid .d{color:var(--mute);font-size:13px;margin-top:2px}
.chip{flex:none;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap}
.r5{background:#f0c36b;color:#2b1d00}.r4{background:#6fbf9a;color:#0b2a1d}.r3{background:#4fa3c7;color:#06212e}
.r2{background:#33505f;color:#d5e4ea}.r1{background:#24343e;color:#8aa0aa}.r0{background:transparent;color:#5d727c;border:1px solid var(--line)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sand)}
#detail{margin-top:16px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dhead .t{font-family:Fraunces,serif;font-size:20px;font-weight:600}
.dhead .s{color:var(--mute);font-size:13px}
svg{display:block;width:100%;height:auto;margin-top:10px}
svg.tchart{touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hl{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.hl>div{background:var(--bg2);border-radius:10px;padding:8px 4px;text-align:center}
.hl .ty{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.hl .tm{font-weight:700;font-size:14px;margin-top:2px}
.hl .ht{font-size:13px;color:var(--mute)}
.hl .L .ht{color:var(--water)}
.win{margin-top:10px;font-size:14px;line-height:1.45;color:#d6e3e8}
.win b{color:var(--sand)}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.tabs button{background:var(--bg2);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--sand);color:#2b1d00;border-color:var(--sand);font-weight:700}
.settings{display:flex;flex-direction:column;gap:12px;font-size:14px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.settings input[type=range]{flex:1;accent-color:var(--sand)}
.settings output{width:58px;text-align:right;font-weight:700}
.note{color:var(--mute);font-size:12px;line-height:1.5;margin-top:22px}
.note a{color:var(--mute)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

<script>
// Harmonic tide predictor for NOAA 9412110 Port San Luis (heights ft MLLW)
const HC = [
["M2",1.614,168.2,28.984104],["S2",0.489,163.8,30.0],["N2",0.371,143.6,28.43973],["K1",1.171,214.8,15.041069],
["M4",0.007,274.8,57.96821],["O1",0.732,198.9,13.943035],["MK3",0.003,235.8,44.025173],["S4",0.003,305.1,60.0],
["MN4",0.003,217.9,57.423832],["NU2",0.072,150.5,28.512583],["S6",0.003,43.7,90.0],["MU2",0.046,103.4,27.968208],
["2N2",0.046,114.2,27.895355],["OO1",0.036,247.7,16.139101],["LAM2",0.01,181.6,29.455626],["S1",0.023,326.7,15.0],
["M1",0.043,230.2,14.496694],["J1",0.069,227.0,15.5854435],["SA",0.23,190.6,0.0410686],["MF",0.026,129.3,1.0980331],
["RHO",0.023,193.0,13.471515],["Q1",0.131,191.5,13.398661],["T2",0.03,150.9,29.958933],["2Q1",0.016,194.4,12.854286],
["P1",0.371,212.2,14.958931],["2SM2",0.007,352.3,31.015896],["M3",0.01,0.9,43.47616],["L2",0.026,169.2,29.528479],
["2MK3",0.003,216.9,42.92714],["K2",0.144,156.4,30.082138],["MS4",0.003,274.4,58.984104]];
// Doodson coefficients on [tau, s, h, p, N, p1, 90deg]
const DOOD = {
M2:[2,0,0,0,0,0,0],S2:[2,2,-2,0,0,0,0],N2:[2,-1,0,1,0,0,0],K1:[1,1,0,0,0,0,-1],M4:[4,0,0,0,0,0,0],
O1:[1,-1,0,0,0,0,1],MK3:[3,1,0,0,0,0,-1],S4:[4,4,-4,0,0,0,0],MN4:[4,-1,0,1,0,0,0],NU2:[2,-1,2,-1,0,0,0],
S6:[6,6,-6,0,0,0,0],MU2:[2,-2,2,0,0,0,0],"2N2":[2,-2,0,2,0,0,0],OO1:[1,3,0,0,0,0,-1],LAM2:[2,1,-2,1,0,0,2],
S1:[1,1,-1,0,0,0,0],M1:[1,0,0,1,0,0,-1],J1:[1,2,0,-1,0,0,-1],SA:[0,0,1,0,0,0,0],MF:[0,2,0,0,0,0,0],
RHO:[1,-2,2,-1,0,0,1],Q1:[1,-2,0,1,0,0,1],T2:[2,2,-3,0,0,1,0],"2Q1":[1,-3,0,2,0,0,1],P1:[1,1,-2,0,0,0,1],
"2SM2":[2,4,-4,0,0,0,0],M3:[3,0,0,0,0,0,0],L2:[2,1,0,-1,0,0,2],"2MK3":[3,-1,0,0,0,0,1],K2:[2,2,0,0,0,0,0],
MS4:[4,2,-2,0,0,0,0]};
const D2R=Math.PI/180, R2D=180/Math.PI;
const poly=(c,T)=>c.reduce((a,k,i)=>a+k*Math.pow(T,i),0);
function astro(ms){
  const JD=ms/86400000+2440587.5, T=(JD-2451545)/36525;
  const s=poly([218.3164591,481267.88134236,-0.0013268,1/538841,-1/65194000],T);
  const h=poly([280.46645,36000.76983,0.0003032],T);
  const p=poly([83.3532430,4069.0137111,-0.0103238,-1/80053,1/18999000],T);
  const N=poly([125.0445550,-1934.1361849,0.0020762,1/467410,-1/60616000],T);
  const p1=poly([280.46645-357.52910,36000.76932-35999.05030,0.0003032+0.0001559,0.00000048],T);
  const omega=poly([23.4392911,-0.0130041667,-0.00000016389,0.00000050361],T);
  const ut=((ms/3600000)%24+24)%24;
  const Tang=180+15*ut;
  const tau=Tang+h-s;
  const i=5.145*D2R, w=omega*D2R, n=N*D2R;
  const I=Math.acos(Math.cos(i)*Math.cos(w)-Math.sin(i)*Math.sin(w)*Math.cos(n));
  const nu=Math.asin(Math.sin(i)*Math.sin(n)/Math.sin(I));
  let e1=Math.atan(Math.cos(0.5*(w-i))/Math.cos(0.5*(w+i))*Math.tan(0.5*n))-0.5*n;
  let e2=Math.atan(Math.sin(0.5*(w-i))/Math.sin(0.5*(w+i))*Math.tan(0.5*n))-0.5*n;
  const xi=-(e1+e2);
  const nup=Math.atan(Math.sin(2*I)*Math.sin(nu)/(Math.sin(2*I)*Math.cos(nu)+0.3347));
  const nupp=0.5*Math.atan(Math.sin(I)**2*Math.sin(2*nu)/(Math.sin(I)**2*Math.cos(2*nu)+0.0727));
  const P=p*D2R-xi;
  return {args:[tau,s,h,p,N,p1,90],I,nu,xi,nup,nupp,P};
}
function nodal(a){
  const {I,nu,xi,nup,nupp,P}=a;
  const fM2=Math.cos(I/2)**4/0.9154, uM2=2*xi-2*nu;
  const fO1=Math.sin(I)*Math.cos(I/2)**2/0.3800, uO1=2*xi-nu;
  const fK1=Math.sqrt(0.8965*Math.sin(2*I)**2+0.6001*Math.sin(2*I)*Math.cos(nu)+0.1006), uK1=-nup;
  const fK2=Math.sqrt(19.0444*Math.sin(I)**4+2.7702*Math.sin(I)**2*Math.cos(2*nu)+0.0981), uK2=-2*nupp;
  const fJ1=Math.sin(2*I)/0.7214, uJ1=-nu;
  const fOO1=Math.sin(I)*Math.sin(I/2)**2/0.01640, uOO1=-2*xi-nu;
  const fMf=Math.sin(I)**2/0.1578, uMf=-2*xi;
  const t2=Math.tan(I/2)**2;
  const R=Math.atan(Math.sin(2*P)/(1/(6*t2)-Math.cos(2*P)));
  const Ra=1/Math.sqrt(1-12*t2*Math.cos(2*P)+36*t2*t2);
  const fL2=fM2/Ra, uL2=2*xi-2*nu-R;
  const Q=Math.atan((5*Math.cos(I)-1)/(7*Math.cos(I)+1)*Math.tan(P));
  const Qa=1/Math.sqrt(0.25+1.5*Math.cos(I)*Math.cos(2*P)/Math.cos(I/2)**0.5+2.25*Math.cos(I)**2/Math.cos(I/2)**4);
  const fM1=fO1/Qa, uM1=xi-nu+Q;
  const one=[1,0];
  return {M2:[fM2,uM2],N2:[fM2,uM2],NU2:[fM2,uM2],MU2:[fM2,uM2],"2N2":[fM2,uM2],LAM2:[fM2,uM2],
    S2:one,S4:one,S6:one,S1:one,SA:one,T2:one,P1:one,
    K1:[fK1,uK1],K2:[fK2,uK2],O1:[fO1,uO1],Q1:[fO1,uO1],RHO:[fO1,uO1],"2Q1":[fO1,uO1],
    J1:[fJ1,uJ1],OO1:[fOO1,uOO1],MF:[fMf,uMf],L2:[fL2,uL2],M1:[fM1,uM1],
    M4:[fM2*fM2,2*uM2],MN4:[fM2*fM2,2*uM2],MS4:[fM2,uM2],M3:[fM2**1.5,1.5*uM2],
    MK3:[fM2*fK1,uM2+uK1],"2MK3":[fM2*fM2*fK1,2*uM2-uK1],"2SM2":[fM2,-uM2]};
}
const Z0=2.80; // MSL above MLLW
const cache=new Map();
function dayTerms(dayMs){
  if(cache.has(dayMs)) return cache.get(dayMs);
  const a=astro(dayMs), nf=nodal(a);
  const terms=HC.map(([nm,H,k,sp])=>{
    const c=DOOD[nm]; let V=0; for(let j=0;j<7;j++) V+=c[j]*a.args[j];
    const [f,u]=nf[nm];
    return [f*H,((V+u*R2D-k)%360)*D2R,sp*D2R];
  });
  cache.set(dayMs,terms); return terms;
}
function height(ms){
  const day=Math.floor(ms/86400000)*86400000, hrs=(ms-day)/3600000;
  let y=Z0; for(const [A,ph,sp] of dayTerms(day)) y+=A*Math.cos(ph+sp*hrs);
  return y;
}
function extremes(startMs,endMs){
  const step=6*60000, out=[];
  let p0=height(startMs-step), p1=height(startMs);
  for(let t=startMs;t<endMs;t+=step){
    const p2=height(t+step);
    if((p1>p0&&p1>=p2)||(p1<p0&&p1<=p2)){
      // parabolic refine
      const den=p0-2*p1+p2; const off=den?0.5*(p0-p2)/den:0;
      const tt=t+off*step;
      out.push({t:tt,v:height(tt),type:p1>p0?"H":"L"});
    }
    p0=p1;p1=p2;
  }
  return out;
}


</script>
<script>
const TZ="America/Los_Angeles", LAT=35.1742, LON=-120.7397;
const store={get(k,d){try{const v=localStorage.getItem("am_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("am_"+k,JSON.stringify(v))}catch(e){}}};
let THR=store.get("thr",0.5), BUF=store.get("buf",20), DAYS=60;
const fmtParts=new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",hourCycle:"h23"});
function parts(ms){const o={};for(const p of fmtParts.formatToParts(new Date(ms)))o[p.type]=+p.value;return o}
function offsetH(ms){const p=parts(ms);return (Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)-Math.floor(ms/60000)*60000)/3600000}
function localMidnight(y,m,d){const g=Date.UTC(y,m,d,12);return Date.UTC(y,m,d)-offsetH(g)*3600000}
const tFmt=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});
const tm=ms=>tFmt.format(new Date(ms)).replace(" AM","a").replace(" PM","p");
const wd=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"});
const mo=new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"short"});
const longD=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",month:"long",day:"numeric"});
const ft=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(1)+" ft";

function sun(y,m,d){
  const rad=Math.PI/180, jd=Date.UTC(y,m,d,12)/86400000+2440587.5;
  const n=Math.round(jd-2451545+0.0008), Js=n-LON/360;
  const M=(357.5291+0.98560028*Js)%360, C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const L=(M+C+180+102.9372)%360, Jt=2451545+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  const dec=Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  const w=Math.acos((Math.sin(-0.833*rad)-Math.sin(LAT*rad)*Math.sin(dec))/(Math.cos(LAT*rad)*Math.cos(dec)))/rad;
  const toMs=J=>(J-2440587.5)*86400000;
  return {rise:toMs(Jt-w/360),set:toMs(Jt+w/360)};
}

function analyzeDay(y,m,d){
  const start=localMidnight(y,m,d), end=localMidnight(y,m,d+1);
  const s=sun(y,m,d), dayStart=s.rise-BUF*60000, dayEnd=s.set+BUF*60000;
  const ex=extremes(start,end);
  let minV=99,minT=0,winStart=null,winEnd=null,winMin=0,cur=null;
  for(let t=dayStart;t<=dayEnd;t+=5*60000){
    const h=height(t);
    if(h<minV){minV=h;minT=t}
    if(h<=THR){if(cur==null)cur=t}
    else if(cur!=null){const len=t-cur;if(len>winMin){winMin=len;winStart=cur;winEnd=t}cur=null}
  }
  if(cur!=null){const len=dayEnd-cur;if(len>winMin){winMin=len;winStart=cur;winEnd=dayEnd}}
  // lowest low of whole day (incl. dark)
  const lows=ex.filter(e=>e.type==="L");
  const lowest=lows.reduce((a,b)=>!a||b.v<a.v?b:a,null);
  return {y,m,d,start,end,sun:s,dayStart,dayEnd,ex,minV,minT,winStart,winEnd,winMin,lowest};
}
function rating(v){
  if(v<=-1.0)return[5,"Epic"];if(v<=-0.5)return[4,"Excellent"];if(v<=0)return[3,"Great"];
  if(v<=THR)return[2,"Good"];if(v<=THR+0.7)return[1,"Fair"];return[0,"Skip"];
}
function inQuarantine(y,m){return m>=4&&m<=9} // May (4) through Oct (9)

let days=[], sel=0, tab=0, selD=null, calY=0, calM=0;
function compute(){
  const p=parts(Date.now()); days=[];
  for(let i=0;i<DAYS;i++){const dt=new Date(Date.UTC(p.year,p.month-1,p.day+i));days.push(analyzeDay(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()))}
}
function dateBlock(D){const ms=D.start+12*3600000;return `<div class="date"><div class="dw">${wd.format(ms)}</div><div class="dd">${D.d}</div><div class="dm">${mo.format(ms)}</div></div>`}
function rowHTML(D,i){
  const [r,lab]=rating(D.minV), q=inQuarantine(D.y,D.m);
  const win=D.winMin>0?`${tm(D.winStart)}–${tm(D.winEnd)} below ${ft(THR)}`:`Daylight low ${tm(D.minT)}`;
  const pct=Math.max(0,Math.min(100,(2-D.minV)/3.5*100));
  return `<button class="row${i===sel&&!selD?" sel":""}" data-i="${i}">${dateBlock(D)}
    <div class="mid"><div class="t">${ft(D.minV)} at ${tm(D.minT)}</div><div class="d">${win}${q?" · quarantine":""}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <span class="chip r${r}">${lab}</span></button>`;
}
function renderSeason(){
  const p=parts(Date.now()), q=inQuarantine(p.year,p.month-1), el=document.getElementById("season");
  el.className="banner season "+(q?"no":"ok");
  el.innerHTML=(q?`<b>See You Next Season</b><div class="sd">Nov 1 – April 30</div>`
    :`<b>It’s Mussel Season</b><div class="sd">Nov 1 – April 30</div>`);
}
function renderNow(){
  const n=Date.now(), h=height(n), h2=height(n+10*60000);
  document.getElementById("nowH").textContent=ft(h);
  const ex=extremes(n,n+30*3600000);
  const nx=ex[0], nl=ex.find(e=>e.type==="L");
  document.getElementById("nowTrend").textContent=(h2>h?"Rising":"Falling")+(nx?` · ${nx.type==="H"?"high":"low"} ${tm(nx.t)}`:"");
  if(nl){document.getElementById("nextL").textContent=ft(nl.v);document.getElementById("nextLs").textContent=`${wd.format(nl.t)} ${tm(nl.t)}`}
}
function renderBest(){if(!document.getElementById("best"))return;
  const idx=days.map((D,i)=>i).filter(i=>i<45).sort((a,b)=>days[a].minV-days[b].minV).slice(0,5);
  document.getElementById("best").innerHTML=idx.map(i=>rowHTML(days[i],i)).join("");
}
function renderTabs(){if(!document.getElementById("tabs"))return;
  const labels=["Next 2 weeks","Weeks 3–4","Weeks 5–6","Weeks 7–8"];
  document.getElementById("tabs").innerHTML=labels.map((l,i)=>`<button class="${i===tab?"on":""}" data-t="${i}">${l}</button>`).join("");
  document.getElementById("list").innerHTML=days.slice(tab*14,tab*14+14).map((D,j)=>rowHTML(D,tab*14+j)).join("");
}
function chart(D){
  const W=360,H=190,pl=26,pr=8,pt=12,pb=22,ymin=-2,ymax=8;
  const X=t=>pl+(t-D.start)/(D.end-D.start)*(W-pl-pr), Y=v=>pt+(ymax-v)/(ymax-ymin)*(H-pt-pb);
  let pts=[];for(let t=D.start;t<=D.end;t+=10*60000)pts.push([X(t),Y(height(t))]);
  const path="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L");
  const area=path+`L${X(D.end)},${Y(ymin)}L${X(D.start)},${Y(ymin)}Z`;
  let g=`<rect x="${pl}" y="${pt}" width="${X(D.sun.rise)-pl}" height="${H-pt-pb}" fill="var(--night)"/>
    <rect x="${X(D.sun.set)}" y="${pt}" width="${W-pr-X(D.sun.set)}" height="${H-pt-pb}" fill="var(--night)"/>
    <rect x="${X(D.sun.rise)}" y="${pt}" width="${X(D.sun.set)-X(D.sun.rise)}" height="${H-pt-pb}" fill="#2e5d78"/>`;
  for(let v=-2;v<=8;v+=2)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#26404f" stroke-width=".6"/><text x="${pl-4}" y="${Y(v)+3}" fill="#93a9b3" font-size="9" text-anchor="end">${v}</text>`;
  for(let hr=0;hr<=24;hr+=6){const t=D.start+hr*3600000;g+=`<text x="${X(t)}" y="${H-6}" fill="#93a9b3" font-size="9" text-anchor="middle">${hr===0||hr===24?"12a":hr===12?"12p":hr<12?hr+"a":(hr-12)+"p"}</text>`}
  g+=`<path d="${area}" fill="rgba(79,163,199,.28)"/><path d="${path}" fill="none" stroke="var(--water)" stroke-width="2"/>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="#93a9b3" stroke-width=".8"/>`;
  for(const e of D.ex){const x=X(e.t),y=Y(e.v);g+=`<circle cx="${x}" cy="${y}" r="3" fill="${e.type==="L"?"var(--sand)":"#eef3f1"}"/><text x="${x}" y="${e.type==="L"?y+13:y-6}" fill="#eef3f1" font-size="9" font-weight="700" text-anchor="middle">${e.v.toFixed(1)}</text>`}
  g+=`<g class="scrub" style="display:none"><line class="sl" y1="${pt}" y2="${H-pb}" stroke="#eef3f1" stroke-width="1"/><circle class="sd" r="4.5" fill="#eef3f1" stroke="#0f1b24" stroke-width="2"/><rect class="sb" y="${pt+2}" height="20" rx="6" fill="#eef3f1"/><text class="st" y="${pt+16}" fill="#0f1b24" font-size="11" font-weight="700" text-anchor="middle"></text></g>`;
  return `<svg class="tchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tide curve" data-s="${D.start}" data-e="${D.end}" data-pl="${pl}" data-pr="${pr}" data-w="${W}" data-pt="${pt}" data-ph="${H-pt-pb}" data-ymin="${ymin}" data-ymax="${ymax}">${g}</svg>`;
}
function renderDetail(D0,target){if(!document.getElementById(target||"detail"))return;
  const D=D0||days[sel], [r,lab]=rating(D.minV);
  const lo=D.lowest;const hl=lo?`<div class="L"><div class="ty">Lowest tide</div><div class="tm">${tm(lo.t)}</div><div class="ht">${ft(lo.v)}</div></div>`:"";
  let win;
  if(D.winMin>0){win=`Lowest daylight tide: <b>${ft(D.minV)} at ${tm(D.minT)}</b>.`}
  else win=`No daylight water below ${ft(THR)}. Lowest in daylight: ${ft(D.minV)} at ${tm(D.minT)}.`;
  if(D.lowest&&D.lowest.v<D.minV-0.3)win+=` The day's lowest tide, ${ft(D.lowest.v)}, comes at ${tm(D.lowest.t)} in the dark.`;
  if(inQuarantine(D.y,D.m))win+=` <span style="color:var(--coral)">The mussel quarantine is on for this date.</span>`;
  document.getElementById(target||"detail").innerHTML=`<div class="dhead"><div class="t">${longD.format(D.start+12*3600000)}</div><span class="chip r${r}">${lab}</span></div>
   <div class="dhead"><div class="s">Sunrise ${tm(D.sun.rise)} · Sunset ${tm(D.sun.set)}</div></div>
   ${chart(D)}
   <div class="legend"><span><i style="background:var(--night);border:1px solid #26404f"></i>Night</span><span><i style="background:#2e5d78"></i>Daylight</span></div>
   <div class="hl">${hl}</div>`;
}
function showBio(st,line,warn){
  const el=document.getElementById("bio"),v=document.getElementById("bioV"),sEl=document.getElementById("bioS");
  el.className="bio"+(st==="SAFE"?" safe":st==="UNSAFE"?" unsafe":"");
  v.textContent=st;sEl.className="bs"+(warn?" warn":"");
  if(st==="UNCHECKED"){sEl.innerHTML=`<a class="callbtn" href="tel:18005534133" target="_top">Click to Call</a><div class="callnum">CDPH Biotoxin Hotline · 1-800-553-4133</div>`}
  else sEl.textContent=line;
}
const unchecked=()=>showBio("UNCHECKED");
const BIO_EMBED={"status":"SAFE","checkedAt":"2026-11-13T19:01:00Z"};
function applyBio(d){
  const p=parts(Date.now()),q=inQuarantine(p.year,p.month-1);
  if(!d||(d.status!=="SAFE"&&d.status!=="UNSAFE")){if(q)showBio("UNSAFE","Annual mussel quarantine (May 1 – Oct 31)");else unchecked();return}
  const t=Date.parse(d.checkedAt),age=(Date.now()-t)/3600000;
  const when=isNaN(t)?"":`Last checked ${mo.format(t)} ${parts(t).day} at ${tFmt.format(new Date(t))}`;
  if(q)showBio("UNSAFE",when||"Annual mussel quarantine (May 1 – Oct 31)");
  else if(!(age<=26))unchecked();
  else showBio(d.status,when);
}
async function loadBio(){
  applyBio(BIO_EMBED);
  try{
    const r=await fetch("status.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const d=await r.json();
    if(d&&(d.status==="SAFE"||d.status==="UNSAFE")&&!(Date.parse(d.checkedAt)<=Date.parse(BIO_EMBED.checkedAt)))applyBio(d);
  }catch(e){}
}
function starsFor(v){const r=Math.round(v*10)/10;return r<=-1?2:r<=-0.1?1:0}
function renderCal(){
  const k=calY*12+calM,s0=seasonStart();
  document.getElementById("calPrev").disabled=k<=s0;document.getElementById("calNext").disabled=k>=s0+5;
  const first=new Date(Date.UTC(calY,calM,1)), dim=new Date(Date.UTC(calY,calM+1,0)).getUTCDate(), lead=first.getUTCDay();
  document.getElementById("calMonth").textContent=new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric",timeZone:"UTC"}).format(first);
  document.getElementById("calTitle").textContent="Tide Calendar";
  const p=parts(Date.now());let h="";
  for(let i=0;i<lead;i++)h+=`<div class="cell empty"></div>`;
  for(let d=1;d<=dim;d++){
    const D=analyzeDay(calY,calM,d), n=starsFor(D.minV), today=p.year===calY&&p.month-1===calM&&p.day===d;
    h+=`<button class="cell s${n}${today?" today":""}" data-cd="${d}"><span class="n">${d}</span><span class="stars">${"★".repeat(n)}</span><span class="lv">${n?D.minV.toFixed(1):""}</span></button>`;
  }
  document.getElementById("calGrid").innerHTML=h;
}
function seasonStart(){const p=parts(Date.now()),m=p.month-1;const y=m<=3?p.year-1:p.year;return y*12+10}
let curDay=0;
function seasonBounds(){const s0=seasonStart(),y=Math.floor(s0/12);return [Date.UTC(y,10,1),Date.UTC(y+1,3,30)]}
function showDay(dir){
  const dt=new Date(curDay),el=document.getElementById("dayDetail"),[lo,hi]=seasonBounds();
  const draw=()=>{renderDetail(analyzeDay(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()),"dayDetail");
    document.getElementById("dayPrev").disabled=curDay<=lo;document.getElementById("dayNext").disabled=curDay>=hi;};
  if(!dir){draw();return}
  el.className="card "+(dir>0?"out-l":"out-r");
  setTimeout(()=>{draw();el.style.transition="none";el.className="card "+(dir>0?"out-r":"out-l");void el.offsetWidth;el.style.transition="";el.className="card"},180);
}
function stepDay(dir){const [lo,hi]=seasonBounds(),n=curDay+dir*86400000;if(n<lo||n>hi)return;curDay=n;showDay(dir)}
(function(){let x0=null,y0=0;const v=()=>document.getElementById("dayv");
  document.addEventListener("touchstart",e=>{if(v().hidden||e.touches.length!==1||(e.target.closest&&e.target.closest("svg.tchart"))){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  document.addEventListener("touchend",e=>{if(x0==null||v().hidden)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)stepDay(dx<0?1:-1)},{passive:true});
  document.addEventListener("keydown",e=>{if(v().hidden)return;if(e.key==="ArrowRight")stepDay(1);if(e.key==="ArrowLeft")stepDay(-1)});
})();
function scrubAt(svg,clientX){
  const r=svg.getBoundingClientRect(),d=svg.dataset,W=+d.w,pl=+d.pl,pr=+d.pr;
  let x=(clientX-r.left)/r.width*W;x=Math.max(pl,Math.min(W-pr,x));
  const t=+d.s+(x-pl)/(W-pl-pr)*(+d.e-+d.s),h=height(t);
  const y=+d.pt+(+d.ymax-h)/(+d.ymax-+d.ymin)*(+d.ph);
  const g=svg.querySelector(".scrub");g.style.display="";
  g.querySelector(".sl").setAttribute("x1",x);g.querySelector(".sl").setAttribute("x2",x);
  const c=g.querySelector(".sd");c.setAttribute("cx",x);c.setAttribute("cy",y);
  const label=`${tm(t)} · ${ft(h)}`,tw=label.length*6.2+14,bx=Math.max(pl,Math.min(W-pr-tw,x-tw/2));
  const b=g.querySelector(".sb");b.setAttribute("x",bx);b.setAttribute("width",tw);
  const tx=g.querySelector(".st");tx.setAttribute("x",bx+tw/2);tx.textContent=label;
}
document.addEventListener("pointerdown",e=>{const svg=e.target.closest&&e.target.closest("svg.tchart");if(!svg)return;scrubSvg=svg;try{svg.setPointerCapture(e.pointerId)}catch(_){}scrubAt(svg,e.clientX)});
document.addEventListener("pointermove",e=>{if(scrubSvg)scrubAt(scrubSvg,e.clientX)});
const endScrub=()=>{if(scrubSvg){scrubSvg.querySelector(".scrub").style.display="none";scrubSvg=null}};
document.addEventListener("pointerup",endScrub);document.addEventListener("pointercancel",endScrub);
let scrubSvg=null;
function openCal(){const p=parts(Date.now()),s0=seasonStart(),k=p.year*12+p.month-1;const c=(k>=s0&&k<=s0+5)?k:s0;calY=Math.floor(c/12);calM=c%12;renderCal();document.getElementById("cal").hidden=false;document.body.style.overflow="hidden"}
function closeCal(){document.getElementById("dayv").hidden=true;document.getElementById("cal").hidden=true;document.body.style.overflow=""}
function renderAll(){compute();if(!document.getElementById("cal").hidden)renderCal();renderSeason();renderBest();renderTabs();renderDetail()}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-i]");if(b){sel=+b.dataset.i;selD=null;renderBest();renderTabs();renderDetail();document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});return}
  const c=e.target.closest("[data-cd]");if(c){curDay=Date.UTC(calY,calM,+c.dataset.cd);showDay(0);const v=document.getElementById("dayv");v.hidden=false;v.scrollTop=0;return}
  if(e.target.closest("#dayPrev")){stepDay(-1);return}
  if(e.target.closest("#dayNext")){stepDay(1);return}
  if(e.target.closest("#dayBack")){const dt=new Date(curDay);calY=dt.getUTCFullYear();calM=dt.getUTCMonth();renderCal();document.getElementById("dayv").hidden=true;return}
  if(e.target.closest("#calOpen")){openCal();return}
  if(e.target.closest("#calClose")){closeCal();return}
  if(e.target.closest("#calPrev")){const k=calY*12+calM-1;if(k>=seasonStart()){calY=Math.floor(k/12);calM=k%12;renderCal()}return}
  if(e.target.closest("#calNext")){const k=calY*12+calM+1;if(k<=seasonStart()+5){calY=Math.floor(k/12);calM=k%12;renderCal()}return}
  const t=e.target.closest("[data-t]");if(t){tab=+t.dataset.t;renderTabs()}
});
renderAll();
loadBio();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}

</script>
